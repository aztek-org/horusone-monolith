# Cloudflare Pages project for the Tower app.
#
# `pnpm --filter tower build` with CF_PAGES=1 uses Nitro's cloudflare-pages
# preset, which emits the deployable bundle to `dist/`.
name = "horus-tower"
pages_build_output_dir = "dist"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# Non-secret public runtime config. Kept here so `wrangler pages deploy`
# uploads them with the deployment; also mirror these in the Pages project
# (Settings -> Environment variables) if you use Git integration instead.
[env.production.vars]
NUXT_PUBLIC_API_URL = "https://api.horusone.app"
NUXT_PUBLIC_WS_URL = "wss://api.horusone.app/ws/voice"
NUXT_PUBLIC_KEYCLOAK_URL = "https://auth.horusone.app"
NUXT_PUBLIC_KEYCLOAK_REALM = "horus"
NUXT_PUBLIC_KEYCLOAK_CLIENT_ID = "horus-web"
NUXT_PUBLIC_HANGAR_URL = "https://hangar.horusone.app"
NUXT_PUBLIC_TOWER_URL = "https://tower.horusone.app"
NUXT_PUBLIC_SQUAWK_URL = "https://squawk.horusone.app"
NUXT_PUBLIC_AUTH_GATEWAY_URL = "https://hangar.horusone.app"
NUXT_PUBLIC_APP_ID = "tower"

[env.preview.vars]
NUXT_PUBLIC_API_URL = "https://api-staging.horusone.app"
NUXT_PUBLIC_WS_URL = "wss://api-staging.horusone.app/ws/voice"
NUXT_PUBLIC_KEYCLOAK_URL = "https://auth-staging.horusone.app"
NUXT_PUBLIC_KEYCLOAK_REALM = "horus"
NUXT_PUBLIC_KEYCLOAK_CLIENT_ID = "horus-web"
NUXT_PUBLIC_HANGAR_URL = "https://hangar-staging.horusone.app"
NUXT_PUBLIC_TOWER_URL = "https://tower-staging.horusone.app"
NUXT_PUBLIC_SQUAWK_URL = "https://squawk-staging.horusone.app"
NUXT_PUBLIC_AUTH_GATEWAY_URL = "https://hangar-staging.horusone.app"
NUXT_PUBLIC_APP_ID = "tower"
