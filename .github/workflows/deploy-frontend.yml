name: Deploy Frontend

# Continuous deployment for the three Nuxt apps to Cloudflare Pages.
#
# Each app is a separate Pages project (horus-hangar / horus-tower /
# horus-squawk). The job is a no-op until CLOUDFLARE_API_TOKEN is configured,
# so this workflow can land before the Cloudflare account is wired up.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id
#
# Optional repository variables (default to the horusone.app production URLs):
#   NUXT_PUBLIC_API_URL, NUXT_PUBLIC_WS_URL, NUXT_PUBLIC_KEYCLOAK_URL, ...
#   See frontend/apps/*/wrangler.toml for the full list.
#
# The Pages project's production branch MUST be set to `tokyo` (this repo's
# default branch) so a push to tokyo produces a production deployment.

on:
  push:
    branches: [tokyo, main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  guard:
    name: Check deploy credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; skipping frontend deploy."
          fi

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: hangar
            project: horus-hangar
          - app: tower
            project: horus-tower
          - app: squawk
            project: horus-squawk
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        env:
          # Activates Nitro's cloudflare-pages preset -> output lands in
          # apps/<app>/dist.
          CF_PAGES: "1"
          NUXT_PUBLIC_API_URL: ${{ vars.NUXT_PUBLIC_API_URL || 'https://api.horusone.app' }}
          NUXT_PUBLIC_WS_URL: ${{ vars.NUXT_PUBLIC_WS_URL || 'wss://api.horusone.app/ws/voice' }}
          NUXT_PUBLIC_KEYCLOAK_URL: ${{ vars.NUXT_PUBLIC_KEYCLOAK_URL || 'https://auth.horusone.app' }}
          NUXT_PUBLIC_KEYCLOAK_REALM: ${{ vars.NUXT_PUBLIC_KEYCLOAK_REALM || 'horus' }}
          NUXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${{ vars.NUXT_PUBLIC_KEYCLOAK_CLIENT_ID || 'horus-web' }}
          NUXT_PUBLIC_HANGAR_URL: ${{ vars.NUXT_PUBLIC_HANGAR_URL || 'https://hangar.horusone.app' }}
          NUXT_PUBLIC_TOWER_URL: ${{ vars.NUXT_PUBLIC_TOWER_URL || 'https://tower.horusone.app' }}
          NUXT_PUBLIC_SQUAWK_URL: ${{ vars.NUXT_PUBLIC_SQUAWK_URL || 'https://squawk.horusone.app' }}
          NUXT_PUBLIC_AUTH_GATEWAY_URL: ${{ vars.NUXT_PUBLIC_AUTH_GATEWAY_URL || 'https://hangar.horusone.app' }}
          NUXT_PUBLIC_APP_ID: ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.app }} build
      - name: Deploy ${{ matrix.app }} to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend/apps/${{ matrix.app }}
          command: pages deploy dist --project-name ${{ matrix.project }} --branch ${{ github.ref_name }}
