[project]
name = "horus-atc-api"
version = "0.1.0"
description = "Air Traffic Control Voice Communication API for Horus Aviation Training Platform"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langgraph>=0.2.0",
    "numpy>=1.22.0,<2.0.0",
    "scipy>=1.10.0",
    "ollama>=0.1.6",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
    "openai-whisper>=20231117",
    "pydub>=0.25.1",
    "soundfile>=0.12.1",
    "pyttsx3>=2.90",
    "gTTS>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "redis[hiredis]>=5.0.0",
    "langchain-groq>=0.3.0,<1.0.0",
    "pgvector>=0.3.6",
    "langgraph-checkpoint-postgres>=3.0.0,<4.0.0",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0.3",
    "pypdf>=5.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
]

[project.optional-dependencies]
otel = ["opentelemetry-exporter-otlp-proto-http>=1.27.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.4.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
]
show_missing = true
